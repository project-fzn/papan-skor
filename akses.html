<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktivasi Papan Skor Digital</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0d0d0d; color: white; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1a1a1a; padding: 25px; border-radius: 12px; max-width: 420px; width: 100%; border: 1px solid #333; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
    h2 { color: #00e5ff; margin-top: 0; }
    p { color: #aaa; font-size: 0.9rem; line-height: 1.4; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #2b2b2b; color: white; text-align: center; font-weight: bold; font-size: 1rem; }
    button { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    button:active { transform: scale(0.98); }
    .result { margin-top: 20px; display: none; text-align: left; background: #000; padding: 15px; border-radius: 8px; border: 1px solid #00ff66; }
    .link-btn { display: block; padding: 10px; background: #00e5ff; color: black; text-decoration: none; font-weight: bold; text-align: center; border-radius: 6px; margin-top: 6px; font-size: 0.9rem; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎉 Aktivasi Papan Skor</h2>
    <p>Masukkan <b>Kode Lisensi</b> yang ada di catatan Lynk.id dan buat <b>Nama Room</b> Anda:</p>
    
    <input type="text" id="licenseInput" placeholder="Masukkan Kode Lisensi (dari Lynk.id)" />
    <input type="text" id="roomInput" placeholder="Contoh Nama Room: gor-jawara" />
    
    <button onclick="activateRoom()">Aktifkan & Buat Link</button>

    <div id="resultBox" class="result">
      <p style="color:#00ff66; font-weight:bold; margin-top:0;">✅ Room Berhasil Diaktifkan!</p>
      
      <p style="margin-bottom:4px; font-size:0.8rem; color:#aaa;">Link Display (Buka di Smart TV):</p>
      <a id="linkTv" class="link-btn" href="#" target="_blank">Buka TV Display</a>
      
      <p style="margin-bottom:4px; margin-top:12px; font-size:0.8rem; color:#aaa;">Link Controller (Buka di HP Wasit):</p>
      <a id="linkHp" class="link-btn" style="background: #ffcc00;" href="#" target="_blank">Buka Remot Wasit</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_5DbpY5XqNMXPTBljXK0gm4zyH-wkAiI",
      authDomain: "papanscore.firebaseapp.com",
      databaseURL: "https://papanscore-default-rtdb.firebaseio.com",
      projectId: "papanscore",
      storageBucket: "papanscore.firebasestorage.app",
      messagingSenderId: "449160493063",
      appId: "1:449160493063:web:364dedee3634cf9a18d2a2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Ganti KODE_RAHASIA ini dengan kata sandi yang Anda berikan di Lynk.id
    const VALID_LICENSE = "NUKA2026"; 

    window.activateRoom = function() {
      const license = document.getElementById('licenseInput').value.trim();
      const roomRaw = document.getElementById('roomInput').value.trim();

      if (license !== VALID_LICENSE) {
        return alert('❌ Kode Lisensi Salah! Silakan cek kembali bukti pembelian di Lynk.id.');
      }

      if (!roomRaw) {
        return alert('⚠️ Silakan isi nama room terlebih dahulu!');
      }

      const room = roomRaw.toLowerCase().replace(/[^a-z0-9-]/g, '-');

      // Otomatis Daftarkan Room ke Firebase Realtime Database
      set(ref(db, `allowed_rooms/${room}`), true).then(() => {
        const urlTv = `https://skordigital.my.id/?room=${room}`;
        const urlHp = `https://skordigital.my.id/controller.html?room=${room}`;

        document.getElementById('linkTv').href = urlTv;
        document.getElementById('linkTv').innerText = urlTv;
        
        document.getElementById('linkHp').href = urlHp;
        document.getElementById('linkHp').innerText = urlHp;

        document.getElementById('resultBox').style.display = 'block';
      }).catch((err) => {
        alert('Gagal mengaktifkan room: ' + err.message);
      });
    };
  </script>
</body>
</html>
