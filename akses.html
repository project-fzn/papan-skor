<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktivasi Papan Skor Digital</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d0d0d; color: white; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1a1a1a; padding: 25px; border-radius: 12px; max-width: 440px; width: 100%; border: 1px solid #333; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
    h2 { color: #00e5ff; margin-top: 0; font-size: 1.5rem; }
    p { color: #aaa; font-size: 0.88rem; line-height: 1.4; }
    label { font-size: 0.8rem; color: #888; text-align: left; display: block; margin-top: 10px; font-weight: 600; }
    input { width: 100%; padding: 12px; margin: 6px 0 10px 0; border-radius: 6px; border: 1px solid #444; background: #2b2b2b; color: white; text-align: center; font-size: 0.95rem; }
    input:focus { border-color: #00e5ff; outline: none; }
    button { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 12px; transition: 0.2s; }
    button:hover { background: #218838; }
    
    .result { margin-top: 20px; display: none; text-align: left; background: #000; padding: 15px; border-radius: 8px; border: 1px solid #00ff66; }
    .link-btn { display: block; padding: 10px; background: #00e5ff; color: black; text-decoration: none; font-weight: bold; text-align: center; border-radius: 6px; margin-top: 6px; font-size: 0.85rem; word-break: break-all; }
    .btn-wa { background: #25d366; color: white; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎉 Aktivasi Papan Skor</h2>
    <p>Masukkan <b>Email Pembelian Lynk.id</b> dan buat <b>Nama Room</b> Anda:</p>
    
    <label>Email Saat Pembelian:</label>
    <input type="email" id="emailInput" placeholder="contoh: fauuuzaan@gmail.com" />

    <label>Nama Room / GOR yang Diinginkan:</label>
    <input type="text" id="roomInput" placeholder="Contoh: gor-jawara" />
    
    <button onclick="activateRoom()">Aktifkan & Buat Link Akses</button>

    <div id="resultBox" class="result">
      <p style="color:#00ff66; font-weight:bold; margin-top:0;">✅ Room Berhasil Diaktifkan!</p>
      
      <p style="margin-bottom:4px; font-size:0.8rem; color:#aaa;">Link Display (Buka di Smart TV):</p>
      <a id="linkTv" class="link-btn" href="#" target="_blank">Buka TV Display</a>
      
      <p style="margin-bottom:4px; margin-top:12px; font-size:0.8rem; color:#aaa;">Link Controller (Buka di HP Wasit):</p>
      <a id="linkHp" class="link-btn" style="background: #ffcc00;" href="#" target="_blank">Buka Remot Wasit</a>

      <a id="waBtn" class="btn-wa" href="#" target="_blank">
        📲 Simpan & Kirim Rekap Link ke WA Saya
      </a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_5DbpY5XqNMXPTBljXK0gm4zyH-wkAiI",
      authDomain: "papanscore.firebaseapp.com",
      databaseURL: "https://papanscore-default-rtdb.firebaseio.com",
      projectId: "papanscore",
      storageBucket: "papanscore.firebasestorage.app",
      messagingSenderId: "449160493063",
      appId: "1:449160493063:web:364dedee3634cf9a18d2a2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.activateRoom = async function() {
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const roomRaw = document.getElementById('roomInput').value.trim();

      if (!email || !roomRaw) {
        return alert('⚠️ Harap isi Email Pembelian dan Nama Room!');
      }

      const room = roomRaw.toLowerCase().replace(/[^a-z0-9-]/g, '-');

      try {
        // Cari transaksi di Firebase berdasarkan email
        const licensesRef = ref(db, 'valid_licenses');
        const snapshot = await get(licensesRef);

        if (!snapshot.exists()) {
          return alert('❌ Transaksi tidak ditemukan! Pastikan Anda memasukkan email yang sama saat membeli di Lynk.id.');
        }

        let foundRefId = null;
        let licenseData = null;

        snapshot.forEach((childSnap) => {
          const val = childSnap.val();
          if (val.email && val.email.toLowerCase() === email) {
            foundRefId = childSnap.key;
            licenseData = val;
          }
        });

        if (!foundRefId) {
          return alert('❌ Email transaksi tidak terdaftar atau pembayaran belum sukses!');
        }

        // Cek apakah lisensi email ini sudah dipakai untuk mengaktifkan room
        if (licenseData.status === "USED" && licenseData.room !== room) {
          return alert(`❌ GAGAL: Email ini sudah digunakan untuk mengaktifkan room "${licenseData.room}". 1 Pembelian hanya berlaku untuk 1 Room!`);
        }

        // Aktifkan Room & Kunci status lisensi di Firebase
        await set(ref(db, `allowed_rooms/${room}`), true);
        await set(ref(db, `valid_licenses/${foundRefId}`), {
          status: "USED",
          email: email,
          room: room
        });

        const urlTv = `https://skordigital.my.id/?room=${room}`;
        const urlHp = `https://skordigital.my.id/controller.html?room=${room}`;

        document.getElementById('linkTv').href = urlTv;
        document.getElementById('linkTv').innerText = urlTv;
        
        document.getElementById('linkHp').href = urlHp;
        document.getElementById('linkHp').innerText = urlHp;

        const waMessage = encodeURIComponent(
          `🏆 *LINK AKSES PAPAN SKOR DIGITAL*\n\n` +
          `Nama Room: *${room}*\n` +
          `Email Pembeli: \`${email}\`\n\n` +
          `📺 *Link Display TV:* ${urlTv}\n\n` +
          `📱 *Link Remot Wasit:* ${urlHp}\n\n` +
          `Simpan pesan ini untuk mengontrol papan skor Anda!`
        );
        document.getElementById('waBtn').href = `https://api.whatsapp.com/send?text=${waMessage}`;

        document.getElementById('resultBox').style.display = 'block';

      } catch (err) {
        alert('Terjadi kesalahan: ' + err.message);
      }
    };
  </script>
</body>
</html>
