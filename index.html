<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papan Skor Digital LED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #000;
      color: white;
      font-family: 'VT323', monospace;
      margin: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
    }

    .led-board {
      width: 95vw;
      height: 53.43vw;
      border: 8px solid #333;
      background-color: #050505;
      padding: 2vw;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 2.5fr 1fr 2.5fr;
      grid-template-rows: 1fr auto;
      gap: 1vw;
      position: relative;
    }

    .led-text {
      position: relative;
      background-image: 
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 3px 3px;
    }

    .led-red { color: #ff3333; text-shadow: 0 0 15px #ff3333, 0 0 5px #ff0000; }
    .led-yellow { color: #ffcc00; text-shadow: 0 0 15px #ffcc00, 0 0 5px #ff9900; }
    .led-blue { color: #33ccff; text-shadow: 0 0 15px #33ccff, 0 0 5px #0099ff; }
    .led-green { color: #33ff33; text-shadow: 0 0 15px #33ff33, 0 0 5px #00ff00; }
    .led-white { color: #ffffff; text-shadow: 0 0 10px #ffffff; }

    .team-info { line-height: 1.1; display: flex; flex-direction: column; justify-content: space-between; }
    .team-name { font-size: 5.5vw; }

    .middle-stats { grid-column: 2; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; margin-top: -2vw; }
    .set-container { display: flex; align-items: center; font-size: 3vw; margin-bottom: 0.5vw; }
    .set-label { margin: 0 1vw; }
    .set-value { font-size: 8vw; color: #ffcc00; }

    .wins-container { display: flex; justify-content: space-between; width: 100%; align-items: center; margin-top: -1vw; }
    .win-item { display: flex; flex-direction: column; align-items: center; }
    .win-value { font-size: 6vw; }
    .win-label { font-size: 2vw; color: #ffffff; line-height: 1; }

    .score-container { grid-row: 2; font-size: 22vw; line-height: 1; text-align: center; }
    .score-team-a { grid-column: 1; }
    .score-team-b { grid-column: 3; }

    .footer-label { position: absolute; bottom: 2vw; font-size: 4vw; color: #ffffff; }
    .label-l { left: 4vw; }
    .label-r { right: 4vw; }
  </style>
</head>
<body>

  <div class="led-board">
    <div class="team-info score-team-a led-text">
      <div class="team-name led-red">GRUNDA<br>PUTRA</div>
    </div>
    <div class="team-info score-team-b led-text">
      <div class="team-name led-red">BNI46<br>JKT</div>
    </div>

    <div class="middle-stats led-text">
      <div class="set-container led-white">
        <span>&lt;</span><span class="set-label">SET</span><span>&gt;</span>
      </div>
      <div id="set-value" class="set-value led-yellow">1</div>
      
      <div class="wins-container">
        <div class="win-item">
          <div id="win-a" class="win-value led-yellow">0</div>
          <div class="win-label">WIN</div>
        </div>
        <div class="win-item">
          <div id="win-b" class="win-value led-yellow">0</div>
          <div class="win-label">WIN</div>
        </div>
      </div>
    </div>

    <div id="score-a" class="score-container score-team-a led-blue led-text">00</div>
    <div id="score-b" class="score-container score-team-b led-green led-text">00</div>

    <div class="footer-label label-l led-white led-text">L</div>
    <div class="footer-label label-r led-white led-text">R</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_5DbpY5XqNMXPTBljXK0gm4zyH-wkAiI",
      authDomain: "papanscore.firebaseapp.com",
      databaseURL: "https://papanscore-default-rtdb.firebaseio.com",
      projectId: "papanscore",
      storageBucket: "papanscore.firebasestorage.app",
      messagingSenderId: "449160493063",
      appId: "1:449160493063:web:364dedee3634cf9a18d2a2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, 'scoreboard'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('score-a').innerText = String(data.teamA_score || 0).padStart(2, '0');
        document.getElementById('score-b').innerText = String(data.teamB_score || 0).padStart(2, '0');
        document.getElementById('set-value').innerText = data.set_value || 1;
        document.getElementById('win-a').innerText = data.teamA_wins || 0;
        document.getElementById('win-b').innerText = data.teamB_wins || 0;
        
        if(data.teamA_name) document.querySelector('.score-team-a .team-name').innerHTML = data.teamA_name;
        if(data.teamB_name) document.querySelector('.score-team-b .team-name').innerHTML = data.teamB_name;
      }
    });
  </script>
</body>
</html>
