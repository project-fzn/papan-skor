<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skor Digital - Display TV</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<!-- Tambahan style="opacity: 0;" agar tidak berkedip data lama saat refresh -->
<body id="mainBody" style="opacity: 0; transition: opacity 0.2s ease-in-out;">

  <!-- HEADER -->
  <div class="scoreboard-header" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
    <div id="nameA" class="team-title"></div>
    
    <div class="center-header" style="display: flex; flex-direction: column; align-items: center;">
      <img id="leagueLogo" src="" alt="Logo Turnamen" style="display: none; width: 120px; height: 120px; object-fit: contain; margin-bottom: 5px;">
      <div id="leagueName" class="league-name"></div>
    </div>
    
    <div id="nameB" class="team-title"></div>
  </div>

  <!-- BODY SKOR -->
  <div class="scoreboard-body">
    <div id="scoreA" class="score-box">--</div>
    
    <div class="center-stats">
      <div class="set-label">&lt; SET &gt;</div>
      <div id="setValue" class="set-val">-</div>
      <div class="win-container">
        <div class="win-box"><span id="winA">-</span><br><small>WIN</small></div>
        <div class="win-box"><span id="winB">-</span><br><small>WIN</small></div>
      </div>
    </div>

    <div id="scoreB" class="score-box">--</div>
  </div>

  <div class="scoreboard-footer">
    <div>L</div>
    <div>R</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB_5Dbpy5XqNMXPTBljXK0gm4zyH-wkAiI",
      authDomain: "papanscore.firebaseapp.com",
      databaseURL: "https://papanscore-default-rtdb.firebaseio.com",
      projectId: "papanscore",
      storageBucket: "papanscore.firebasestorage.app",
      messagingSenderId: "449160493063",
      appId: "1:449160493063:web:364dedee3634cf9a18d2a2",
      measurementId: "G-49GMLNNH3W"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';

    db.ref('rooms/' + roomId).on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('nameA').innerHTML = data.nameA || 'TIM A';
        document.getElementById('nameB').innerHTML = data.nameB || 'TIM B';
        
        document.getElementById('scoreA').innerText = String(data.scoreA || 0).padStart(2, '0');
        document.getElementById('scoreB').innerText = String(data.scoreB || 0).padStart(2, '0');
        document.getElementById('setValue').innerText = data.set || 1;
        document.getElementById('winA').innerText = data.winA || 0;
        document.getElementById('winB').innerText = data.winB || 0;

        if (data.leagueName) {
          document.getElementById('leagueName').innerHTML = data.leagueName;
        }

        const logoImg = document.getElementById('leagueLogo');
        if (data.leagueLogo && data.leagueLogo.trim() !== "") {
          logoImg.src = data.leagueLogo;
          logoImg.style.display = "block";
        } else {
          logoImg.style.display = "none";
        }

        // Tampilkan halaman secara mulus setelah data Firebase siap (menghilangkan kedipan)
        document.getElementById('mainBody').style.opacity = '1';
      }
    });
  </script>
</body>
</html>
