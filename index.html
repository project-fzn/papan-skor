<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skor Digital - Display TV</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- HEADER -->
  <div class="scoreboard-header">
    <div id="nameA" class="team-title">TIM A</div>
    
    <div class="center-header">
      <img id="leagueLogo" src="" alt="Logo" class="league-logo" style="display: none;">
      <div id="leagueName" class="league-name">PHERMANA CUP 2026</div>
    </div>
    
    <div id="nameB" class="team-title team-b-title">TIM B</div>
  </div>

  <!-- BODY / SKOR -->
  <div class="scoreboard-body">
    <div id="scoreA" class="score-box">00</div>
    
    <div class="center-stats">
      <div class="set-label">&lt; SET &gt;</div>
      <div id="setValue" class="set-val">1</div>
      <div class="win-container">
        <div class="win-box"><span id="winA">0</span><br><small>WIN</small></div>
        <div class="win-box"><span id="winB">0</span><br><small>WIN</small></div>
      </div>
    </div>

    <div id="scoreB" class="score-box">00</div>
  </div>

  <!-- FOOTER -->
  <div class="scoreboard-footer">
    <div>L</div>
    <div>R</div>
  </div>

  <script>
    // ⚠️ Ganti Konfigurasi Firebase Anda di Sini
    const firebaseConfig = {
  apiKey: "AIzaSyB_5Dbpy5XqNMXPTBljXK0gm4zyH-wkAiI",
  authDomain: "papanscore.firebaseapp.com",
  databaseURL: "https://papanscore-default-rtdb.firebaseio.com",
  projectId: "papanscore",
  storageBucket: "papanscore.firebasestorage.app",
  messagingSenderId: "449160493063",
  appId: "1:449160493063:web:364dedee3634cf9a18d2a2",
  measurementId: "G-49GMLNNH3W"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Ambil Parameter Room dari URL (?room=123)
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';

    // Real-time Listener dari Firebase
    db.ref('rooms/' + roomId).on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('nameA').innerText = data.nameA || 'TIM A';
        document.getElementById('nameB').innerText = data.nameB || 'TIM B';
        document.getElementById('scoreA').innerText = String(data.scoreA || 0).padStart(2, '0');
        document.getElementById('scoreB').innerText = String(data.scoreB || 0).padStart(2, '0');
        document.getElementById('setValue').innerText = data.set || 1;
        document.getElementById('winA').innerText = data.winA || 0;
        document.getElementById('winB').innerText = data.winB || 0;

        // Update Nama Liga
        if (data.leagueName) {
          document.getElementById('leagueName').innerText = data.leagueName;
        }

        // Update Logo Liga
        const logoImg = document.getElementById('leagueLogo');
        if (data.leagueLogo && data.leagueLogo.trim() !== "") {
          logoImg.src = data.leagueLogo;
          logoImg.style.display = "block";
        } else {
          logoImg.style.display = "none";
        }
      }
    });
  </script>
</body>
</html>
