<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papan Skor Digital Modern LED</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #000;
      color: white;
      font-family: 'Chakra Petch', sans-serif;
      margin: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
    }

    .led-board {
      width: 96vw;
      height: 54vw;
      border: 8px solid #222;
      border-radius: 12px;
      background-color: #050505;
      padding: 1.5vw 1.5vw 0.5vw 1.5vw;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 2.5fr 1.2fr 2.5fr;
      grid-template-rows: 1fr 1.2fr auto; /* Baris 1: Nama, Baris 2: Skor, Baris 3: Running Text Bawah */
      gap: 0.5vw 1vw;
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }

    .digital-font {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
    }

    /* Warna LED */
    .led-red { color: #ff2a2a; text-shadow: 0 0 20px rgba(255,42,42,0.8), 0 0 5px #ff0000; }
    .led-yellow { color: #ffcc00; text-shadow: 0 0 20px rgba(255,204,0,0.8), 0 0 5px #ffaa00; }
    .led-blue { color: #00e5ff; text-shadow: 0 0 25px rgba(0,229,255,0.8), 0 0 8px #00aaff; }
    .led-green { color: #00ff66; text-shadow: 0 0 25px rgba(0,255,102,0.8), 0 0 8px #00cc44; }
    .led-white { color: #ffffff; text-shadow: 0 0 10px #ffffff; }

    /* BARIS ATAS: NAMA TIM & LOGO/LIGA */
    .team-info { 
      line-height: 1.0; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      text-align: center;
      width: 100%;
      height: 100%;
      grid-row: 1;
    }
    
    .team-name { 
      font-size: 3.8vw; 
      font-weight: 700;
      letter-spacing: 1px;
      word-break: break-word;
      text-align: center;
      width: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .league-top-container {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
    }

    .league-logo-img {
      max-width: 11vw;
      max-height: 11vw;
      object-fit: contain;
      margin-bottom: 0.3vw;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
    }

    .league-title {
      font-size: 1.8vw;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.1;
      word-break: break-word;
      width: 100%;
    }

    /* BARIS TENGAH: SKOR UTAMA & SET/WIN */
    .middle-stats { 
      grid-column: 2; 
      grid-row: 2;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100%;
    }

    .set-container { display: flex; align-items: center; font-size: 1.8vw; font-weight: bold; margin-bottom: 0.1vw; }
    .set-label { margin: 0 0.5vw; letter-spacing: 2px; }
    .set-value { font-size: 5.5vw; line-height: 1; margin-bottom: 0.3vw; }

    .wins-container { display: flex; justify-content: space-around; width: 100%; align-items: center; position: relative; }
    .win-item { display: flex; flex-direction: column; align-items: center; position: relative; }
    .win-value { font-size: 4.5vw; line-height: 1; }
    .win-label { font-size: 1.5vw; color: #ffffff; font-weight: bold; letter-spacing: 1px; }

    /* INDIKATOR SERVIS */
    .serve-icon {
      font-size: 2.2vw;
      position: absolute;
      top: -1.8vw;
      left: 50%;
      transform: translateX(-50%);
      display: none;
    }

    /* SKOR UTAMA */
    .score-container { 
      grid-row: 2; 
      font-size: 18vw; 
      line-height: 0.85; 
      text-align: center; 
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 0.5vw;
    }
    .score-team-a { grid-column: 1; }
    .score-team-b { grid-column: 3; }

    /* BARIS BAWAH: RUNNING TEXT MEMBENTANG DI BOTTOM */
    .ticker-wrap {
      grid-column: span 3;
      grid-row: 3;
      width: 100%;
      overflow: hidden;
      background: #0d0d0d;
      border-top: 2px solid #222;
      padding: 0.4vw 0;
      margin-top: 0.4vw;
      display: flex;
      align-items: center;
      border-radius: 0 0 6px 6px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .ticker-move {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: ticker 20s linear infinite;
      font-size: 2vw;
      font-weight: bold;
      letter-spacing: 2px;
      color: #ffcc00;
      text-shadow: 0 0 10px rgba(255,204,0,0.8);
    }

    @keyframes ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    /* Footer L/R */
    .footer-label { position: absolute; bottom: 3vw; font-size: 3vw; font-weight: bold; }
    .label-l { left: 2.5vw; } 
    .label-r { right: 2.5vw; }
  </style>
</head>
<body>

  <div id="boardContainer" class="led-board">
    <!-- TIM A (ATAS KIRI) -->
    <div class="team-info score-team-a">
      <div class="team-name led-red">TIM A</div>
    </div>

    <!-- LOGO & LIGA (ATAS TENGAH) -->
    <div class="league-top-container">
      <img id="league-logo" class="league-logo-img" src="" alt="" style="display: none;">
      <div id="league-name" class="league-title led-yellow">INPUT NAMA LIGA DI SINI</div>
    </div>

    <!-- TIM B (ATAS KANAN) -->
    <div class="team-info score-team-b">
      <div class="team-name led-red">TIM B</div>
    </div>

    <!-- SKOR TIM A (TENGAH KIRI) -->
    <div id="score-a" class="score-container score-team-a digital-font led-blue">00</div>

    <!-- SET & WIN (TENGAH TENGAH) -->
    <div class="middle-stats">
      <div class="set-container led-white">
        <span>&lt;</span><span class="set-label">SET</span><span>&gt;</span>
      </div>
      <div id="set-value" class="set-value digital-font led-yellow">1</div>
      
      <div class="wins-container">
        <div class="win-item">
          <span id="serve-a" class="serve-icon">🏸</span>
          <div id="win-a" class="win-value digital-font led-yellow">0</div>
          <div class="win-label">WIN</div>
        </div>
        <div class="win-item">
          <span id="serve-b" class="serve-icon">🏸</span>
          <div id="win-b" class="win-value digital-font led-yellow">0</div>
          <div class="win-label">WIN</div>
        </div>
      </div>
    </div>

    <!-- SKOR TIM B (TENGAH KANAN) -->
    <div id="score-b" class="score-container score-team-b digital-font led-green">00</div>

    <!-- RUNNING TEXT LED (PALING BAWAH) -->
    <div class="ticker-wrap">
      <div id="running-text" class="ticker-move">
        SELAMAT DATANG DI TURNAMEN BULUTANGKIS DIGITAL - JUNJUNG TINGGI SPORTIVITAS!
      </div>
    </div>

    <div class="footer-label label-l led-white">L</div>
    <div class="footer-label label-r led-white">R</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_5DbpY5XqNMXPTBljXK0gm4zyH-wkAiI",
      authDomain: "papanscore.firebaseapp.com",
      databaseURL: "https://papanscore-default-rtdb.firebaseio.com",
      projectId: "papanscore",
      storageBucket: "papanscore.firebasestorage.app",
      messagingSenderId: "449160493063",
      appId: "1:449160493063:web:364dedee3634cf9a18d2a2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'demo';

    const formatScore = (val) => {
      if (val === undefined || val === null) return '00';
      const num = parseInt(val, 10);
      return isNaN(num) ? '00' : String(num).padStart(2, '0');
    };

    onValue(ref(db, `scoreboard/${roomId}`), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('score-a').innerText = formatScore(data.teamA_score);
        document.getElementById('score-b').innerText = formatScore(data.teamB_score);
        document.getElementById('set-value').innerText = data.set_value ?? 1;
        document.getElementById('win-a').innerText = data.teamA_wins ?? 0;
        document.getElementById('win-b').innerText = data.teamB_wins ?? 0;
        
        if (data.league_name) document.getElementById('league-name').innerHTML = data.league_name;
        if (data.teamA_name) document.querySelector('.score-team-a .team-name').innerHTML = data.teamA_name;
        if (data.teamB_name) document.querySelector('.score-team-b .team-name').innerHTML = data.teamB_name;

        // RUNNING TEXT REALTIME
        if (data.running_text) {
          document.getElementById('running-text').innerText = data.running_text;
        }

        const logoEl = document.getElementById('league-logo');
        if (data.league_logo && data.league_logo.trim() !== '') {
          logoEl.src = data.league_logo;
          logoEl.style.display = 'block';
        } else {
          logoEl.style.display = 'none';
        }

        const serveA = document.getElementById('serve-a');
        const serveB = document.getElementById('serve-b');
        if (data.service === 'teamA') {
          serveA.style.display = 'block';
          serveB.style.display = 'none';
        } else if (data.service === 'teamB') {
          serveA.style.display = 'none';
          serveB.style.display = 'block';
        } else {
          serveA.style.display = 'none';
          serveB.style.display = 'none';
        }
      }

      document.getElementById('boardContainer').style.opacity = '1';
    });
  </script>
</body>
</html>
