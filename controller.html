<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remot Wasit - Skor Digital</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #121212; color: #fff; padding: 15px; }
    h2 { text-align: center; color: #ffb700; margin-bottom: 15px; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    label { font-size: 12px; color: #aaa; display: block; margin-top: 8px; }
    input { width: 100%; padding: 10px; margin-top: 4px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-gold { background: #ffb700; color: #000; }
    .btn-blue { background: #00f0ff; color: #000; }
    .btn-green { background: #00ff66; color: #000; }
    .btn-danger { background: #ff3333; color: #fff; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h2>🎮 REMOT WASIT</h2>

  <!-- CARD 1: PENGATURAN LIGA & TIM -->
  <div class="card">
    <h3>⚙️ Info Turnamen</h3>
    <label>Nama Liga / Turnamen:</label>
    <input type="text" id="inputLeagueName" placeholder="PHERMANA CUP 2026">
    
    <label>URL Logo (Link Gambar PNG/JPG):</label>
    <input type="text" id="inputLeagueLogo" placeholder="https://i.ibb.co/example/logo.png">
    
    <button class="btn btn-gold" onclick="saveTournamentInfo()">Simpan Info Turnamen</button>
  </div>

  <div class="card">
    <h3>🛡️ Nama Tim</h3>
    <div class="grid-2">
      <div>
        <label>Tim A (Kiri):</label>
        <input type="text" id="inputTeamA" placeholder="TIM A">
      </div>
      <div>
        <label>Tim B (Kanan):</label>
        <input type="text" id="inputTeamB" placeholder="TIM B">
      </div>
    </div>
    <button class="btn btn-gold" onclick="saveTeamNames()">Simpan Nama Tim</button>
  </div>

  <!-- CARD 2: KONTROL SKOR HASIL REALTIME -->
  <div class="card">
    <h3>🏆 Kontrol Skor</h3>
    <div class="grid-2">
      <div>
        <button class="btn btn-blue" onclick="changeScore('scoreA', 1)">+1 SKOR A</button>
        <button class="btn btn-danger" onclick="changeScore('scoreA', -1)">-1 SKOR A</button>
      </div>
      <div>
        <button class="btn btn-green" onclick="changeScore('scoreB', 1)">+1 SKOR B</button>
        <button class="btn btn-danger" onclick="changeScore('scoreB', -1)">-1 SKOR B</button>
      </div>
    </div>
  </div>

  <!-- CARD 3: RESET -->
  <div class="card">
    <button class="btn btn-danger" onclick="resetAll()">⚠️ RESET TOTAL SKOR</button>
  </div>

  <script>
    // ⚠️ Ganti Konfigurasi Firebase Anda di Sini (Samakan dengan index.html)
    const firebaseConfig = {
  apiKey: "AIzaSyB_5Dbpy5XqNMXPTBljXK0gm4zyH-wkAiI",
  authDomain: "papanscore.firebaseapp.com",
  databaseURL: "https://papanscore-default-rtdb.firebaseio.com",
  projectId: "papanscore",
  storageBucket: "papanscore.firebasestorage.app",
  messagingSenderId: "449160493063",
  appId: "1:449160493063:web:364dedee3634cf9a18d2a2",
  measurementId: "G-49GMLNNH3W"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    const roomRef = db.ref('rooms/' + roomId);

    // Simpan Info Turnamen & Logo
    function saveTournamentInfo() {
      const name = document.getElementById('inputLeagueName').value;
      const logo = document.getElementById('inputLeagueLogo').value;
      roomRef.update({ leagueName: name, leagueLogo: logo });
      alert('Info Turnamen Terupdate!');
    }

    // Simpan Nama Tim
    function saveTeamNames() {
      const a = document.getElementById('inputTeamA').value;
      const b = document.getElementById('inputTeamB').value;
      roomRef.update({ nameA: a, nameB: b });
      alert('Nama Tim Terupdate!');
    }

    // Tambah / Kurang Skor
    function changeScore(field, val) {
      roomRef.child(field).transaction((current) => {
        return Math.max(0, (current || 0) + val);
      });
    }

    // Reset All
    function resetAll() {
      if(confirm("Yakin ingin reset skor menjadi 0?")) {
        roomRef.update({ scoreA: 0, scoreB: 0, set: 1, winA: 0, winB: 0 });
      }
    }
  </script>
</body>
</html>
