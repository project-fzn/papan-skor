<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remot Wasit</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #121212; color: #fff; padding: 15px; margin: 0; }
    
    /* MINI SCOREBOARD FIXED / STICKY (FREEZE SAAT DI-SCROLL) */
    .mini-scoreboard { 
      position: sticky;
      top: 0;
      z-index: 9999;
      background: #1e1e1e; 
      border: 2px solid #333; 
      border-radius: 10px; 
      padding: 10px; 
      text-align: center; 
      margin-bottom: 15px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .mini-teams { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
    .mini-scores { display: flex; justify-content: space-between; font-size: 36px; font-weight: bold; }
    .mini-score-a { color: #00f0ff; }
    .mini-score-b { color: #00ff66; }
    .mini-stats { font-size: 12px; color: #ffb700; margin-top: 5px; font-weight: bold; }

    /* FORM & BUTTONS */
    .card { background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    label { font-size: 12px; color: #aaa; display: block; margin-top: 5px; }
    input, textarea { width: 100%; padding: 8px; margin-top: 3px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; }
    textarea { height: 45px; resize: vertical; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-gold { background: #ffb700; color: #000; }
    .btn-blue { background: #00f0ff; color: #000; font-size: 18px; }
    .btn-green { background: #00ff66; color: #000; font-size: 18px; }
    .btn-orange { background: #ff7700; color: #fff; }
    .btn-purple { background: #9900ff; color: #fff; }
    .btn-danger { background: #ff3333; color: #fff; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body id="controllerBody" style="opacity: 0; transition: opacity 0.2s ease-in-out;">

  <!-- MINI SCORE VISIBILITY WASIT (STICKY ATAS) -->
  <div class="mini-scoreboard">
    <div class="mini-teams">
      <span id="miniNameA">...</span>
      <span id="miniNameB">...</span>
    </div>
    <div class="mini-scores">
      <span id="miniScoreA" class="mini-score-a">--</span>
      <span id="miniScoreB" class="mini-score-b">--</span>
    </div>
    <div class="mini-stats">
      SET: <span id="miniSet">-</span> | WIN A: <span id="miniWinA">-</span> - WIN B: <span id="miniWinB">-</span>
    </div>
  </div>

  <!-- INPUT NAMA LIGA & LOGO -->
  <div class="card">
    <label>Nama Liga / Turnamen:</label>
    <input type="text" id="inputLeagueName" placeholder="PHERMANA CUP 2026">
    
    <label>URL Logo Turnamen (Link Image):</label>
    <input type="text" id="inputLeagueLogo" placeholder="https://i.postimg.cc/xxx/logo.png">
    
    <button class="btn btn-gold" onclick="updateTournament()">Update Turnamen & Logo</button>
  </div>

  <!-- INPUT NAMA TIM -->
  <div class="card">
    <div class="grid-2">
      <div>
        <label>Nama Tim A (Gunakan Enter untuk 2 baris):</label>
        <textarea id="inputTeamA" placeholder="FAUZAN&#10;TIO"></textarea>
      </div>
      <div>
        <label>Nama Tim B (Gunakan Enter untuk 2 baris):</label>
        <textarea id="inputTeamB" placeholder="IRFAN&#10;RUDI"></textarea>
      </div>
    </div>
    <button class="btn btn-gold" onclick="updateTeams()">Update Nama Tim</button>
  </div>

  <!-- KONTROL SKOR WASIT -->
  <div class="card">
    <div class="grid-2">
      <div>
        <button class="btn btn-blue" onclick="changeValue('scoreA', 1)">+1 TIM A</button>
        <button class="btn btn-danger" onclick="changeValue('scoreA', -1)">-1 TIM A</button>
      </div>
      <div>
        <button class="btn btn-green" onclick="changeValue('scoreB', 1)">+1 TIM B</button>
        <button class="btn btn-danger" onclick="changeValue('scoreB', -1)">-1 TIM B</button>
      </div>
    </div>
  </div>

  <!-- KONTROL SET & WIN -->
  <div class="card">
    <label style="text-align: center; font-weight: bold; margin-bottom: 8px;">⚙️ KONTROL SET & WIN</label>
    <div class="grid-3">
      <div>
        <button class="btn btn-orange" onclick="changeValue('winA', 1)">+1 WIN A</button>
        <button class="btn btn-danger" onclick="changeValue('winA', -1)">-1 WIN A</button>
      </div>
      <div>
        <button class="btn btn-purple" onclick="changeValue('set', 1)">+1 SET</button>
        <button class="btn btn-danger" onclick="changeValue('set', -1)">-1 SET</button>
      </div>
      <div>
        <button class="btn btn-orange" onclick="changeValue('winB', 1)">+1 WIN B</button>
        <button class="btn btn-danger" onclick="changeValue('winB', -1)">-1 WIN B</button>
      </div>
    </div>
  </div>

  <!-- RESET -->
  <div class="card">
    <button class="btn btn-danger" onclick="resetScores()">RESET SKOR</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB_5Dbpy5XqNMXPTBljXK0gm4zyH-wkAiI",
      authDomain: "papanscore.firebaseapp.com",
      databaseURL: "https://papanscore-default-rtdb.firebaseio.com",
      projectId: "papanscore",
      storageBucket: "papanscore.firebasestorage.app",
      messagingSenderId: "449160493063",
      appId: "1:449160493063:web:364dedee3634cf9a18d2a2",
      measurementId: "G-49GMLNNH3W"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    const roomRef = db.ref('rooms/' + roomId);

    roomRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('miniNameA').innerHTML = data.nameA || 'TIM A';
        document.getElementById('miniNameB').innerHTML = data.nameB || 'TIM B';
        document.getElementById('miniScoreA').innerText = String(data.scoreA || 0).padStart(2, '0');
        document.getElementById('miniScoreB').innerText = String(data.scoreB || 0).padStart(2, '0');
        document.getElementById('miniSet').innerText = data.set || 1;
        document.getElementById('miniWinA').innerText = data.winA || 0;
        document.getElementById('miniWinB').innerText = data.winB || 0;

        document.getElementById('controllerBody').style.opacity = '1';
      }
    });

    function updateTournament() {
      const name = document.getElementById('inputLeagueName').value;
      const logo = document.getElementById('inputLeagueLogo').value;
      roomRef.update({ leagueName: name, leagueLogo: logo });
    }

    function updateTeams() {
      let a = document.getElementById('inputTeamA').value.replace(/\n/g, '<br>');
      let b = document.getElementById('inputTeamB').value.replace(/\n/g, '<br>');
      roomRef.update({ nameA: a, nameB: b });
    }

    function changeValue(field, val) {
      roomRef.child(field).transaction((current) => {
        let minVal = (field === 'set') ? 1 : 0;
        return Math.max(minVal, (current || 0) + val);
      });
    }

    function resetScores() {
      roomRef.update({ scoreA: 0, scoreB: 0, set: 1, winA: 0, winB: 0 });
    }
  </script>
</body>
</html>
